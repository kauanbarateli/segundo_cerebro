name: CI

# Roda no push da main e em todo pull request. Não roda em agendamento: a
# checagem de vulnerabilidade aqui é sobre O QUE ESTE COMMIT INTRODUZ. Um
# alerta que aparece sozinho às 3h da manhã, sem mudança de código, é ruído
# num repositório de uma pessoa só — e o `npm audit` local resolve quando a
# pergunta for "e hoje, como está?".
on:
  push:
    branches: [main]
  pull_request:

# Cancela execução anterior do mesmo ramo: dois pushes seguidos não precisam
# de duas rodadas completas, e a primeira já está obsoleta quando a segunda
# começa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # `node-version-file` em vez de um número escrito aqui: o .nvmrc é a
      # fonte única da versão, e é o mesmo arquivo que o ambiente local lê.
      # Duas declarações da versão divergem — e divergem em silêncio, com o CI
      # passando numa versão que ninguém usa para desenvolver.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` e não `npm install`: instala EXATAMENTE o package-lock.json e
      # falha se ele estiver dessincronizado do package.json. É o que garante
      # que o CI testa a mesma árvore de dependências que vai para produção —
      # incluindo os `overrides` de postcss e sharp.
      - name: Instalar dependências
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      # CONTRATO DE CAMADAS — as quatro regras que já estavam escritas em
      # comentário, agora executáveis. Ver .dependency-cruiser.cjs para o que
      # cada uma protege e por quê.
      #
      # Roda ANTES dos testes porque é rápido (~5s) e porque um import que
      # atravessa camada costuma ser a causa de falhas mais adiante — saber
      # disso primeiro encurta a leitura do log.
      #
      # Falha o CI de propósito: as quatro regras vêm de defeito real já
      # ocorrido, e nenhuma delas tem exceção legítima prevista.
      - name: Contrato de camadas
        run: npx depcruise src --config .dependency-cruiser.cjs

      - name: Testes
        run: npx vitest run

      - name: Build
        run: npx next build
        env:
          # O build renderiza páginas e precisa das variáveis públicas
          # existirem; valores de fachada bastam, porque nada é chamado de
          # verdade. Segredo REAL não entra aqui: um workflow que roda em pull
          # request de terceiro exporia o que estivesse no ambiente.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-fachada-para-o-build
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Prova 6.4 do plano do ClickUp, automatizada.
      #
      # Roda DEPOIS do build porque é o artefato construído que ela inspeciona —
      # não o código-fonte. Typecheck, lint e testes não pegam vazamento de
      # segredo para o pacote do navegador: foi exatamente uma varredura assim
      # que pegou a regressão do `process.env[chave]` (acesso dinâmico que o
      # Next não substitui no cliente), depois de tudo o mais passar.
      #
      # O que cada padrão significa se aparecer:
      #   api.clickup.com   → algum componente de cliente fala com a API direto,
      #                       o que quebra a invariante I2 e mandaria o token
      #                       para o navegador para poder autenticar;
      #   clickup_credentials / token_ciphertext → nome de tabela ou coluna de
      #                       segredo alcançou o cliente, sinal de que uma
      #                       consulta migrou de lugar;
      #   pk_<20+>          → um token literal foi parar no código.
      - name: Segredos não vazaram para o pacote do navegador
        run: |
          set -e
          if grep -rlE 'api\.clickup\.com|clickup_credentials|token_ciphertext|TOKEN_ENCRYPTION|pk_[A-Za-z0-9]{20,}' .next/static/; then
            echo "::error::Segredo ou chamada externa encontrada no pacote do navegador (arquivos acima)."
            exit 1
          fi
          echo "OK: nada sensível em .next/static"

      # CÓDIGO MORTO — em modo RELATÓRIO, e o `|| true` é deliberado.
      #
      # O projeto já encontrou código morto à mão (a prop `right` do PageHeader,
      # removida porque `grep -rn 'right={' src` não retornava nada). Knip faz
      # isso sozinho e vai continuar achando à medida que a base cresce.
      #
      # ⚠️ POR QUE NÃO FALHA O CI (ainda): knip acerta muito e erra em casos
      # legítimos — export consumido só por convenção do framework, tipo usado
      # apenas em `.d.ts`. Ligar como bloqueio antes de ler o primeiro relatório
      # é o caminho conhecido para alguém desligar a ferramenta na primeira
      # sexta-feira. A ordem é: relatório → avaliar os achados → ajustar o
      # `knip.json` → só então trocar por `npx knip`.
      #
      # ⚠️ NÃO FOI POSSÍVEL RODAR NA MÁQUINA LOCAL: o binário nativo do
      # oxc-resolver (dependência do knip) é bloqueado pela política de Controle
      # de Aplicativo do Windows. Não é defeito de configuração e não afeta o
      # runner Linux do CI — mas significa que este passo estreia aqui, e é mais
      # uma razão para ele não ser bloqueante já.
      - name: Código morto (relatório)
        run: npx knip --no-exit-code || true

      # ÚLTIMO PASSO, e de propósito: uma vulnerabilidade nova numa dependência
      # não deve esconder um erro de tipo ou um teste quebrado. Rodando por
      # último, o log mostra primeiro o que é problema DO CÓDIGO.
      #
      # `--omit=dev` porque o que importa é o que VAI PARA PRODUÇÃO. O
      # ferramental de desenvolvimento (eslint, vitest) não é servido a
      # ninguém, e incluí-lo faria o CI falhar por um advisory de DoS num
      # parser de glob que só roda na máquina de quem programa. `--audit-level`
      # é a linha que faz o passo FALHAR: sem ele, o npm imprime o relatório e
      # sai com zero.
      - name: Vulnerabilidades de produção
        run: npm audit --omit=dev --audit-level=high
